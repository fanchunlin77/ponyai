[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ponyai"
version = "0.1.0"
description = "A reproducible, backtestable, canary-deployable quantitative trading platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ponyai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
